<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather for Brookhaven, MS (39601)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            text-align: center;
        }

        .location {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .area-code {
            font-size: 1rem;
            color: #666;
            margin-bottom: 20px;
        }

        .weather-widget-container {
            min-height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 20px;
        }

        .weather-widget {
            width: 100%;
            height: auto;
            min-height: 420px;
            border: none;
            border-radius: 10px;
        }

        .loading, .error {
            color: #667eea;
            font-size: 1.2rem;
            padding: 40px;
        }

        .error {
            color: #e74c3c;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #667eea;
            border-radius: 50%;
            border-top-color: transparent;
            animation: pulse 1s ease-in-out infinite;
            vertical-align: middle;
            margin-left: 10px;
        }

        .info-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #495057;
        }

        .info-box a {
            color: #667eea;
            text-decoration: none;
        }

        .info-box a:hover {
            text-decoration: underline;
        }

        .status-message {
            font-size: 1rem;
            padding: 20px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            color: #856404;
        }

        .status-message strong {
            display: block;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="weather-card">
        <h1 class="location">Brookhaven, MS</h1>
        <p class="area-code">Area Code: 39601</p>
        
        <div id="content" class="weather-widget-container">
            <div class="loading">Loading weather...</div>
        </div>

        <div class="info-box">
            <strong>ℹ️ About this page:</strong>
            This is a local HTML file showing Brookhaven, MS weather. 
            For more detailed forecasts, visit:
            <br><br>
            • <a href="https://weather.com/weather/today/l/Brookhaven+MS" target="_blank">Weather.com</a>
            <br>• <a href="https://www.accuweather.com/en/us/brookhaven-ms/39601/current-weather/m7248_5" target="_blank">AccuWeather</a>
        </div>
    </div>

    <script>
        function loadWeatherWidget() {
            const contentDiv = document.getElementById('content');
            
            // Using Weather.com embed widget for Brookhaven, MS
            // This is a reliable weather widget that works from GitHub Pages
            const weatherWidgetHTML = `
                <iframe 
                    class="weather-widget"
                    src="https://www.weather.com/weather/today/l/Brookhaven+MS"
                    title="Weather for Brookhaven, MS"
                    style="width: 100%; height: 450px; border: none; border-radius: 10px;"
                    allowfullscreen>
                </iframe>
            `;
            
            contentDiv.innerHTML = weatherWidgetHTML;
        }

        // Load widget on page load with a slight delay
        window.addEventListener('load', () => {
            setTimeout(loadWeatherWidget, 500);
        });
    </script>
</body>
</html>
