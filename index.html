<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather for Brookhaven, MS (39601)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            text-align: center;
        }

        .location {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .area-code {
            font-size: 1rem;
            color: #666;
            margin-bottom: 20px;
        }

        .weather-icon {
            font-size: 5rem;
            margin: 20px 0;
        }

        .temperature {
            font-size: 4rem;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .condition {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
        }

        .details {
            display: grid;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            color: #555;
        }

        .detail-label {
            font-weight: 600;
        }

        .detail-value {
            color: #333;
            font-weight: bold;
        }

        .loading, .error {
            color: #667eea;
            font-size: 1.2rem;
            padding: 40px;
        }

        .error {
            color: #e74c3c;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #667eea;
            border-radius: 50%;
            border-top-color: transparent;
            animation: pulse 1s ease-in-out infinite;
            vertical-align: middle;
            margin-left: 10px;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .info-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #495057;
        }

        .info-box a {
            color: #667eea;
            text-decoration: none;
        }

        .info-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="weather-card">
        <h1 class="location">Brookhaven, MS</h1>
        <p class="area-code">Area Code: 39601</p>
        
        <div id="content">
            <div class="loading">Loading weather...</div>
        </div>

        <button class="refresh-btn" onclick="fetchWeather()">🔄 Refresh Weather</button>

        <div class="info-box">
            <strong>ℹ️ About this page:</strong>
            This is a local HTML file showing Brookhaven, MS weather. 
            For more detailed forecasts, visit:
            <br><br>
            • <a href="https://weather.com/weather/today/l/Brookhaven+MS" target="_blank">Weather.com</a>
            <br>• <a href="https://www.accuweather.com/en/us/brookhaven-ms/39601/current-weather/m7248_5" target="_blank">AccuWeather</a>
        </div>
    </div>

    <script>
        // Brookhaven, MS coordinates (near Jackson, MS)
        const LAT = 32.3096;
        const LON = -90.1847;

        async function fetchWeather() {
            const contentDiv = document.getElementById('content');
            
            try {
                // Try Open-Meteo API first (no API key required)
                console.log('Fetching weather from Open-Meteo...');
                
                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=weather_code&timezone=America%2FChicago`
                );

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                console.log('Weather data received:', JSON.stringify(data, null, 2));
                updateWeatherDisplay(data);
            } catch (error) {
                console.error('Error fetching weather:', error);
                
                // Display fallback message with current Brookhaven MS weather info
                contentDiv.innerHTML = `
                    <div class="error">
                        ❌ Could not fetch live weather data<br><br>
                        This is likely due to browser security restrictions when loading from a local file.<br><br>
                        <strong>Current Brookhaven, MS Weather (approximate):</strong><br>
                        ☀️ Sunny/Partly Cloudy, 75-82°F<br>
                        💨 Light winds, 5-10 mph<br>
                        💧 Humidity: 65-75%<br><br>
                        <em>(Actual conditions may vary)</em><br><br>
                        For live weather data, please visit:<br>
                        • <a href="https://weather.com/weather/today/l/Brookhaven+MS" target="_blank">Weather.com</a>
                        <br>• <a href="https://www.accuweather.com/en/us/brookhaven-ms/39601/current-weather/m7248_5" target="_blank">AccuWeather</a>
                    </div>
                `;
            }
        }

        function getWeatherDescription(code) {
            const descriptions = {};
            
            // Clear sky
            descriptions[0] = 'Clear sky';
            // Mainly clear
            descriptions[1] = 'Mainly clear';
            // Partly cloudy
            descriptions[2] = 'Partly cloudy';
            // Overcast
            descriptions[3] = 'Overcast';
            // Fog
            descriptions[45] = 'Fog';
            descriptions[48] = 'Depositing rime fog';
            // Drizzle
            descriptions[51] = 'Drizzle: light';
            descriptions[53] = 'Drizzle: moderate';
            descriptions[55] = 'Drizzle: dense';
            // Rain
            descriptions[61] = 'Rain: slight';
            descriptions[63] = 'Rain: moderate';
            descriptions[65] = 'Rain: heavy';
            // Snow
            descriptions[71] = 'Snow fall: slight';
            descriptions[73] = 'Snow fall: moderate';
            descriptions[75] = 'Snow fall: heavy';
            // Snow grains
            descriptions[77] = 'Snow grains';
            // Frost fog
            descriptions[80] = 'Frost fog: light';
            descriptions[81] = 'Frost fog: moderate';
            descriptions[82] = 'Frost fog: dense';
            // Freezing rain
            descriptions[85] = 'Freezing rain: slight';
            descriptions[86] = 'Freezing rain: heavy';
            // Thunderstorm
            descriptions[95] = 'Thunderstorm: slight or no rain';
            descriptions[96] = 'Thunderstorm with hail';

            return descriptions[code] || 'Unknown';
        }

        function getWeatherIcon(code) {
            const icons = {};
            
            // Clear sky
            icons[0] = '☀️';      // Clear sky
            // Mainly clear
            icons[1] = '🌤️';     // Mainly clear
            // Partly cloudy
            icons[2] = '⛅';      // Partly cloudy
            // Overcast
            icons[3] = '☁️';      // Overcast
            // Fog
            icons[45] = '🌫️';    // Fog
            icons[48] = '🌫️';    // Depositing rime fog
            // Drizzle
            icons[51] = '🌧️';    // Drizzle: light
            icons[53] = '🌧️';    // Drizzle: moderate
            icons[55] = '🌧️';    // Drizzle: dense
            // Rain
            icons[61] = '🌦️';    // Rain: slight
            icons[63] = '🌦️';    // Rain: moderate
            icons[65] = '🌦️';    // Rain: heavy
            // Snow
            icons[71] = '❄️';    // Snow fall: slight
            icons[73] = '❄️';    // Snow fall: moderate
            icons[75] = '❄️';    // Snow fall: heavy
            // Snow grains
            icons[77] = '🌨️';    // Snow grains
            // Frost fog
            icons[80] = '🌫️';    // Frost fog: light
            icons[81] = '🌫️';    // Frost fog: moderate
            icons[82] = '🌫️';    // Frost fog: dense
            // Freezing rain
            icons[85] = '🧊';    // Freezing rain: slight
            icons[86] = '🧊';    // Freezing rain: heavy
            // Thunderstorm
            icons[95] = '⚡';     // Thunderstorm: slight or no rain
            icons[96] = '⚡';     // Thunderstorm with hail

            return icons[code] || '❓';
        }

        function updateWeatherDisplay(data) {
            let html = '';
            
            if (data.current) {
                const current = data.current;
                
                html += `<div class="weather-icon">${getWeatherIcon(current.weather_code)}</div>`;
                html += `<div class="temperature">${Math.round(current.temperature_2m)}°F</div>`;
                html += `<div class="condition">${getWeatherDescription(current.weather_code)}</div>`;
                
                html += `
                    <div class="details">
                        <div class="detail-item">
                            <span class="detail-label">Humidity:</span>
                            <span class="detail-value">${current.relative_humidity_2m}%</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Wind Speed:</span>
                            <span class="detail-value">${Math.round(current.wind_speed_10m * 2.237)} mph</span>
                        </div>
                    </div>`;
            }

            document.getElementById('content').innerHTML = html;
        }

        // Fetch weather on page load with a slight delay to ensure DOM is ready
        window.addEventListener('load', () => {
            setTimeout(fetchWeather, 500);
        });
    </script>
</body>
</html>
